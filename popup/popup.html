<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nirma Smart Attendance</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="nsa-popup">
    <!-- Clean Minimal Header -->
    <header class="nsa-header">
      <div class="nsa-brand">
        <span class="nsa-logo">A+</span>
        <div>
          <h1 class="nsa-title">Smart Attendance</h1>
          <span class="nsa-sub">Leave &amp; Target Calculator</span>
        </div>
      </div>
      <!-- Target Pills -->
      <div class="nsa-target-toggle" id="popupTargetToggle">
        <button class="nsa-target-btn" data-target="75">75%</button>
        <button class="nsa-target-btn" data-target="80">80%</button>
        <button class="nsa-target-btn active" data-target="85">85%</button>
        <button class="nsa-target-btn" data-target="90">90%</button>
      </div>
    </header>

    <!-- INACTIVE STATE -->
    <section id="inactiveState" class="nsa-inactive" style="display: none;">
      <div class="nsa-inactive-icon">
        <svg class="nsa-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h2>Open Attendance Page</h2>
      <p>Please open your Nirma University attendance report:</p>
      <div class="nsa-url-text">https://mis.nirmauni.ac.in/Reports/StudentAttendanceReport.aspx</div>
      <button id="btnOpenAttendancePage" class="nsa-btn nsa-btn-primary">
        <svg class="nsa-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Open Attendance Page
      </button>
      <div id="cachedOptionBox" style="display: none; width: 100%; margin-top: 8px;">
        <button id="btnOpenCachedDashboard" class="nsa-btn nsa-btn-secondary">
          <svg class="nsa-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          View Saved Offline Report
        </button>
      </div>
    </section>

    <!-- ACTIVE STATE -->
    <main id="activeState" class="nsa-active" style="display: none;">
      <!-- Action Bar -->
      <div class="nsa-action-row">
        <button id="btnOpenFullDashboard" class="nsa-btn nsa-btn-primary">
          <svg class="nsa-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
          Full View &amp; Leave Simulator
        </button>
      </div>

      <!-- Course Leave Cards -->
      <div class="nsa-section-title">
        <span>Courses</span>
        <span id="subjectCountBadge" class="nsa-counter">0 courses</span>
      </div>

      <div class="nsa-course-list" id="subjectScrollList">
        <div class="nsa-loading">Loading attendance data...</div>
      </div>
    </main>

    <!-- Simple Footer -->
    <footer class="nsa-footer">
      <span><span class="nsa-dot nsa-dot-safe"></span>Live Connected</span>
      <span>Nirma MIS</span>
    </footer>
  </div>

  <script src="../utils/calculations.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
